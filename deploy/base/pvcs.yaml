apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comp-postgres-pvc
  namespace: comp
  labels:
    app.kubernetes.io/name: comp-postgres
    app.kubernetes.io/part-of: comp-ai
spec:
  storageClassName: openebs-hostpath
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
