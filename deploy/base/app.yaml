apiVersion: apps/v1
kind: Deployment
metadata:
  name: comp-app
  namespace: comp
  labels:
    app.kubernetes.io/name: comp-app
    app.kubernetes.io/part-of: comp-ai
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: comp-app
  template:
    metadata:
      labels:
        app: comp-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: app
          image: comp-app:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
          envFrom:
            - configMapRef:
                name: comp-config
            - secretRef:
                name: comp-secrets
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: comp-app
  namespace: comp
  labels:
    app.kubernetes.io/name: comp-app
    app.kubernetes.io/part-of: comp-ai
spec:
  type: ClusterIP
  selector:
    app: comp-app
  ports:
    - port: 3000
      targetPort: 3000
      name: http
