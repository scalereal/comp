# =============================================================================
# 1. PostgreSQL 17 Deployment & Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comp-postgres
  namespace: comp
  labels:
    app.kubernetes.io/name: comp-postgres
    app.kubernetes.io/part-of: comp-ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: comp-postgres
  template:
    metadata:
      labels:
        app: comp-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comp-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "comp"
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: comp-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: comp-postgres
  namespace: comp
  labels:
    app.kubernetes.io/name: comp-postgres
    app.kubernetes.io/part-of: comp-ai
spec:
  type: ClusterIP
  selector:
    app: comp-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres

---
# =============================================================================
# 2. Redis 7 Deployment & Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comp-redis
  namespace: comp
  labels:
    app.kubernetes.io/name: comp-redis
    app.kubernetes.io/part-of: comp-ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: comp-redis
  template:
    metadata:
      labels:
        app: comp-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: comp-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: comp-redis
  namespace: comp
  labels:
    app.kubernetes.io/name: comp-redis
    app.kubernetes.io/part-of: comp-ai
spec:
  type: ClusterIP
  selector:
    app: comp-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis

---
# =============================================================================
# 3. Serverless Redis HTTP (SRH) REST Proxy Deployment & Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comp-redis-http
  namespace: comp
  labels:
    app.kubernetes.io/name: comp-redis-http
    app.kubernetes.io/part-of: comp-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comp-redis-http
  template:
    metadata:
      labels:
        app: comp-redis-http
    spec:
      containers:
        - name: srh
          image: hiett/serverless-redis-http:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SRH_MODE
              value: "env"
            - name: SRH_CONNECTION_STRING
              value: "redis://comp-redis:6379"
            - name: SRH_PORT
              value: "80"
            - name: SRH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: comp-secrets
                  key: UPSTASH_REDIS_REST_TOKEN
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: comp-redis-http
  namespace: comp
  labels:
    app.kubernetes.io/name: comp-redis-http
    app.kubernetes.io/part-of: comp-ai
spec:
  type: ClusterIP
  selector:
    app: comp-redis-http
  ports:
    - port: 80
      targetPort: 80
      name: http

---
# =============================================================================
# 4. MinIO S3 Object Storage Deployment & Service
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comp-minio
  namespace: comp
  labels:
    app.kubernetes.io/name: comp-minio
    app.kubernetes.io/part-of: comp-ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: comp-minio
  template:
    metadata:
      labels:
        app: comp-minio
    spec:
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio:latest
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: comp-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comp-secrets
                  key: MINIO_ROOT_PASSWORD
          ports:
            - containerPort: 9000
              name: s3-api
            - containerPort: 9001
              name: console
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: comp-minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: comp-minio
  namespace: comp
  labels:
    app.kubernetes.io/name: comp-minio
    app.kubernetes.io/part-of: comp-ai
spec:
  type: ClusterIP
  selector:
    app: comp-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
