name: comp-stack

services:
  postgres:
    image: postgres:17-alpine
    container_name: comp-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=comp
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d comp']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - comp_postgres_data:/var/lib/postgresql/data
    command: postgres -c listen_addresses='*'

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: comp-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - '9000:9000' # S3 API endpoint
      - '9001:9001' # Web console UI
    volumes:
      - comp_minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: comp-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - comp_redis_data:/data

  redis-http:
    image: hiett/serverless-redis-http:latest
    container_name: comp-redis-http
    restart: unless-stopped
    ports:
      - '8079:80'
    environment:
      - SRH_MODE=env
      - SRH_TOKEN=local_redis_token
      - SRH_CONNECTION_STRING=redis://redis:6379
    depends_on:
      - redis

volumes:
  comp_postgres_data:
    name: comp_postgres_data
    external: true
  comp_minio_data:
    name: comp_minio_data
    external: true
  comp_redis_data:
    name: comp_redis_data
