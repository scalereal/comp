x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'
    compress: 'true'

services:
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - packages/db/.env
    logging: *default-logging
  seeder:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - packages/db/.env
    command: sh -lc "bunx prisma generate --schema=node_modules/@trycompai/db/dist/schema.prisma && bun packages/db/prisma/seed/seed.js"
    logging: *default-logging
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      secrets:
        - app_build_env
      args:
        NEXT_PUBLIC_BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    network_mode: host
    env_file:
      - apps/app/.env
    restart: unless-stopped
    command: sh -lc "HOSTNAME=0.0.0.0 PORT=3000 node apps/app/server.js"
    logging: *default-logging
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: portal
      secrets:
        - portal_build_env
      args:
        NEXT_PUBLIC_BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    network_mode: host
    env_file:
      - apps/portal/.env
    restart: unless-stopped
    command: sh -lc "HOSTNAME=0.0.0.0 PORT=3002 node apps/portal/server.js"
    logging: *default-logging

  trigger-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.multistage
      target: builder
    container_name: comp-trigger-worker
    network_mode: host
    working_dir: /app/apps/api
    command: bun run dev:trigger -- --skip-update-check --skip-telemetry
    volumes:
      - ./packages/db/certs:/app/packages/db/certs
    env_file:
      - apps/api/.env
    restart: unless-stopped
    logging: *default-logging

# Available only to the corresponding Docker build RUN secret mount.
secrets:
  app_build_env:
    file: ./apps/app/.env
  portal_build_env:
    file: ./apps/portal/.env
