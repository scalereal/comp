#  FOR TESTING LOCALY ONLY
version: '3.8'

services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.multistage
      target: production
    container_name: comp-api-test
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=3333
    env_file:
      - .env
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3333/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    
    restart: unless-stopped

  trigger-worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.multistage
      target: builder
    container_name: comp-trigger-worker
    network_mode: host
    working_dir: /app/apps/api
    command: bun run dev:trigger -- --skip-update-check --skip-telemetry
    volumes:
      - ../../packages/db/certs:/app/packages/db/certs
    env_file:
      - .env
    restart: unless-stopped


